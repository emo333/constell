<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Constell</title>
    <link rel="stylesheet" href="constell.css" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <main class="overlay" aria-label="Constellation background preview">
      <p class="eyebrow">Constellation Background</p>
      <h1>Constell</h1>
      <p class="copy">Animated starfield with shooting stars. Click the button to toggle theme.</p>
      <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
        🌗 Toggle Theme
      </button>
    </main>

    <!-- Demo: pass a config object on init -->
    <script type="module">
      import { Constell } from "./constell.js";

      Constell.init("#scene", {
        theme: window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light",
        star: { count: 35, hueMin: 170, hueMax: 280 },
        motion:  { frameMs: 33, speed: 5 },     // ~30 fps, normal speed (1-10)
        parallax: { sensitivityX: 0.0008, sensitivityY: 0.0006 },
        visual: { glowThreshold: 0.55, glowRadiusMultiplier: 4.5 },
        shootingStar: {
          hueMin: 200,
          hueMax: 260, // blue-white meteors
        },
      });

      document.getElementById("theme-toggle").addEventListener("click", () => {
        Constell.toggleTheme();
      });
    </script>
  </body>
</html>
